name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager "ndk;28.0.13004108"

      - name: Preparar GStreamer com SRT
        run: |
          curl -L --fail --retry 3 --show-error \
            https://gstreamer.freedesktop.org/data/pkg/android/1.28.6/gstreamer-1.0-android-universal-1.28.6.tar.xz \
            -o "$RUNNER_TEMP/gstreamer.tar.xz"
          mkdir -p "$RUNNER_TEMP/gstreamer"
          tar --no-same-owner -xJf "$RUNNER_TEMP/gstreamer.tar.xz" -C "$RUNNER_TEMP/gstreamer" arm64
          echo "GSTREAMER_ROOT_ANDROID=$RUNNER_TEMP/gstreamer/arm64" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - run: bash scripts/verify_project.sh

      - run: gradle lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Confirmar módulo SRT no APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/"
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libgstreamer_android.so \
            | strings | grep -Eq "GstSRTSrc|gst_element_register_srtsrc"
          unzip -p app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' \
            | strings | grep -q "GstAmcOnFrameAvailableListener"

      - uses: actions/upload-artifact@v4
        with:
          name: signal-play-debug
          path: app/build/outputs/apk/debug/app-debug.apk
